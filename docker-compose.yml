version: '3.8'

services:
  endcom-net:
    build: .
    container_name: endcom-net-assistant
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./tammy.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

